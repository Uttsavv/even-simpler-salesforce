# Documentation site config (Zensical, native format; spec §16, O1).
#   uvx --from 'zensical>=0.1' --with 'mkdocstrings-python>=2' zensical serve        # http://localhost:8000
#   uvx --from 'zensical>=0.1' --with 'mkdocstrings-python>=2' zensical build --clean  # -> site/ (gitignored)
# docs.yml rewrites site_url per published copy (/dev/, /latest/).

[project]
site_name = "even-simpler-salesforce"
site_description = "A modern, typed, async-first Salesforce client for Python."
site_author = "Utsav Singh"
site_url = "https://uttsavv.github.io/even-simpler-salesforce/"
repo_url = "https://github.com/Uttsavv/even-simpler-salesforce"
repo_name = "Uttsavv/even-simpler-salesforce"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Utsav Singh &middot; Apache-2.0 &middot; Not affiliated with or endorsed by Salesforce, Inc."
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Authentication" = [
    "authentication/index.md",
    { "Salesforce setup (External Client Apps)" = "authentication/salesforce-setup.md" },
    { "Web server flow (PKCE)" = "authentication/web-server-flow.md" },
    { "Client credentials" = "authentication/client-credentials.md" },
    { "JWT bearer" = "authentication/jwt-bearer.md" },
    { "Static token" = "authentication/static-token.md" },
    { "Token stores" = "authentication/token-stores.md" },
  ] },
  { "Guides" = [
    { "Records" = "guides/records.md" },
    { "Query and search" = "guides/query.md" },
    { "Collections" = "guides/collections.md" },
    { "Raw requests" = "guides/requests.md" },
    { "Composite" = "guides/composite.md" },
    { "GraphQL" = "guides/graphql.md" },
    { "Bulk API 2.0" = "guides/bulk.md" },
    { "Files" = "guides/files.md" },
    { "Invocable actions" = "guides/actions.md" },
    { "Apex REST" = "guides/apex.md" },
    { "Lead convert and merge" = "guides/convert-and-merge.md" },
    { "Platform events" = "guides/events.md" },
    { "Tooling API" = "guides/tooling.md" },
    { "UI API" = "guides/ui-api.md" },
    { "Reports and dashboards" = "guides/reports.md" },
    { "Metadata API" = "guides/metadata.md" },
    { "Pub/Sub API" = "guides/pubsub.md" },
  ] },
  { "Errors" = "errors.md" },
  { "Usage & budgets" = "usage-and-budgets.md" },
  { "Logging" = "logging.md" },
  { "Performance" = "performance.md" },
  { "Integrations" = [
    { "FastAPI" = "integrations/fastapi.md" },
    { "Flask" = "integrations/flask.md" },
  ] },
  { "Testing" = "testing.md" },
  { "Migrating from simple-salesforce" = "migrating-from-simple-salesforce.md" },
  { "Salesforce dependency index" = "salesforce-dependencies.md" },
  { "Reference" = "reference/index.md" },
  { "Changelog" = "changelog.md" },
  { "ADRs" = "adr/index.md" },
]

[project.theme]
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.instant",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
show_if_no_docstring = false
