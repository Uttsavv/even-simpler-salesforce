# Documentation site config (Zensical, native format; spec §16, O1).
#   uvx --from 'zensical>=0.1' --with 'mkdocstrings-python>=2' zensical serve        # http://localhost:8000
#   uvx --from 'zensical>=0.1' --with 'mkdocstrings-python>=2' zensical build --clean  # -> site/ (gitignored)
# docs.yml rewrites site_url per published copy (/dev/, /latest/).

[project]
site_name = "even-simpler-salesforce"
site_description = "A modern, typed, async-first Salesforce client for Python."
site_author = "Utsav Singh"
site_url = "https://uttsavv.github.io/even-simpler-salesforce/"
repo_url = "https://github.com/Uttsavv/even-simpler-salesforce"
repo_name = "Uttsavv/even-simpler-salesforce"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Utsav Singh &middot; Apache-2.0 &middot; Not affiliated with or endorsed by Salesforce, Inc."
docs_dir = "docs"
extra_css = ["stylesheets/shadcn.css"]
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Authentication" = [
    { "Overview" = "authentication/index.md" },
    { "Salesforce setup" = "authentication/salesforce-setup.md" },
    { "Client credentials" = "authentication/client-credentials.md" },
    { "JWT bearer" = "authentication/jwt-bearer.md" },
    { "Web server flow" = "authentication/web-server-flow.md" },
    { "Static token" = "authentication/static-token.md" },
    { "Token stores" = "authentication/token-stores.md" },
  ] },
  { "Working with data" = [
    { "Records" = "guides/records.md" },
    { "Query and search" = "guides/query.md" },
    { "Collections" = "guides/collections.md" },
    { "Invocable actions" = "guides/actions.md" },
    { "Apex REST" = "guides/apex.md" },
    { "Files" = "guides/files.md" },
    { "Raw requests" = "guides/requests.md" },
    { "Lead convert and merge" = "guides/leads.md" },
    { "Platform events" = "guides/platform-events.md" },
  ] },
  { "In production" = [
    { "Errors" = "errors.md" },
    { "Usage and budgets" = "usage-and-budgets.md" },
    { "Logging" = "logging.md" },
    { "Performance" = "performance.md" },
  ] },
  { "Tools" = [
    { "FastAPI" = "integrations/fastapi.md" },
    { "Flask" = "integrations/flask.md" },
    { "Testing" = "testing.md" },
    { "CLI" = "cli.md" },
  ] },
  { "Migrating" = [
    { "From simple-salesforce" = "migrating-from-simple-salesforce.md" },
    { "The esf migrate codemod" = "migrate.md" },
  ] },
  { "Reference" = [
    { "API reference" = "reference/index.md" },
    { "Salesforce dependencies" = "salesforce-dependencies.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
]

[project.theme]
# shadcn/ui-inspired styling: docs/stylesheets/shadcn.css; landing hero: overrides/home.html.
custom_dir = "overrides"
font.text = "Geist"
font.code = "JetBrains Mono"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

# Dark by default; the toggle switches to light and the choice is remembered.
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Markdown extensions: Zensical's defaults (minus emoji/arithmatex, which these docs don't use)
# plus pymdownx.snippets, which docs/changelog.md uses to include CHANGELOG.md. Setting this
# table replaces the defaults, so every extension the pages use must be listed here.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
show_if_no_docstring = false
