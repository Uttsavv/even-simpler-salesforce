name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: pyright (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - run: uv run pyright

  unasync:
    name: unasync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - run: uv run python scripts/unasync.py
      - name: Generated _sync/ must be committed and up to date
        run: |
          git diff --exit-code -- src/even_simpler_salesforce/_sync
          untracked=$(git ls-files --others --exclude-standard -- src/even_simpler_salesforce/_sync)
          if [ -n "$untracked" ]; then
            echo "::error::untracked generated files (run 'nox -s unasync' and commit):"
            echo "$untracked"
            exit 1
          fi

  secrets:
    name: no secrets in fixtures/docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for Salesforce session-id / access-token patterns
        run: |
          paths=""
          for p in tests/fixtures docs; do [ -e "$p" ] && paths="$paths $p"; done
          if [ -z "$paths" ]; then echo "nothing to scan"; exit 0; fi
          if grep -rEn '00D[A-Za-z0-9]{12,15}!' $paths; then
            echo "::error::possible Salesforce access token found (pattern 00D...!). Redact it."
            exit 1
          fi
          echo "clean"

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    env:
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --group dev
      # coverage run (not pytest --cov): the pytest11 plugin imports the package before
      # pytest-cov would start measuring.
      - run: uv run coverage run -m pytest tests examples -m "not sandbox"
      - name: Upload coverage data
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: coverage gate
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine
      - name: Overall >= 90 % (lines + branches)
        run: uv run coverage report --fail-under=90
      - name: core/ and errors.py = 100 %
        run: >-
          uv run coverage report --fail-under=100
          --include='*/even_simpler_salesforce/core/*,*/even_simpler_salesforce/errors.py'
      - run: uv run coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  min-deps:
    name: minimum dependencies (httpx 0.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv sync --all-extras --group dev
      - run: uv pip install "httpx==0.27.*"
      - run: uv run --no-sync python -c "import httpx; print('httpx', httpx.__version__)"
      - run: uv run --no-sync pytest tests/unit tests/contract -m "not sandbox"

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - name: zensical build
        run: uv run --with 'zensical>=0.1' --with 'mkdocstrings-python>=2' zensical build --clean
      - name: Docs examples
        run: |
          if [ -d tests/docs ]; then uv run pytest tests/docs; else echo "no tests/docs yet"; fi

  bench:
    name: benchmarks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - name: pytest-benchmark
        run: |
          if [ -d tests/benchmarks ]; then
            uv run pytest tests/benchmarks --benchmark-only --benchmark-json=benchmark.json
          else
            echo "no tests/benchmarks yet"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: benchmark.json
          if-no-files-found: ignore
