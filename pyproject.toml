[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "even-simpler-salesforce"
version = "0.0.1"
description = "A modern, typed, async-first Salesforce client for Python (under active development)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Utsav Singh" }]
keywords = ["salesforce", "api", "async", "httpx", "oauth"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Uttsavv/even-simpler-salesforce"
Repository = "https://github.com/Uttsavv/even-simpler-salesforce"
Documentation = "https://uttsavv.github.io/even-simpler-salesforce/"

[tool.hatch.build.targets.wheel]
packages = ["src/even_simpler_salesforce"]
