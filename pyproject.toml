[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "even-simpler-salesforce"
dynamic = ["version"]
description = "A modern, typed, async-first Salesforce client for Python."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Utsav Singh" }]
keywords = ["salesforce", "api", "async", "httpx", "oauth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
speed = ["orjson>=3.10"]
http2 = ["httpx[http2]>=0.27"]
jwt = ["pyjwt>=2.8", "cryptography>=42"]
otel = ["opentelemetry-api>=1.20"]
structlog = ["structlog>=24.1"]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3.0"]
testing = [
    "respx>=0.21",
    "pytest>=8; python_version != '3.10'",
    "pytest>=8,!=9.2.0; python_version == '3.10'",  # 9.2.0 crashes at startup on 3.10
]
migrate = ["libcst>=1.4"]
all = [
    "even-simpler-salesforce[pydantic,speed,http2,jwt,otel,structlog,fastapi,flask,testing,migrate]",
]

[project.scripts]
esf = "even_simpler_salesforce.cli:main"

[project.entry-points.pytest11]
even_simpler_salesforce = "even_simpler_salesforce.testing.plugin"

[project.urls]
Homepage = "https://github.com/Uttsavv/even-simpler-salesforce"
Repository = "https://github.com/Uttsavv/even-simpler-salesforce"
Documentation = "https://uttsavv.github.io/even-simpler-salesforce/"
Changelog = "https://github.com/Uttsavv/even-simpler-salesforce/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8,<9.2",  # 9.2.0 crashes at startup on Python 3.10 (NodeId._str_cache)
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "respx>=0.21",
    "hypothesis>=6",
    "pyyaml>=6",  # docs/salesforce-dependencies.yaml (tests + scripts/render_sf_index.py)
    "ruff>=0.6",
    "pyright>=1.1.380",
    "nox>=2024.4",
    "towncrier>=24",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pydantic>=2",
    "structlog>=24.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "fastapi>=0.110",
    "flask>=3.0",
    "pre-commit>=3.7",
    "libcst>=1.4",
]
docs = [
    "zensical>=0.1; python_version >= '3.11'",
    "mkdocstrings-python>=2; python_version >= '3.11'",
]

[tool.hatch.version]
path = "src/even_simpler_salesforce/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/even_simpler_salesforce"]

[tool.hatch.build.targets.sdist]
# Source, tests and the files a downstream packager needs; no CI config, caches or docs site.
include = [
    "/src/even_simpler_salesforce",
    "/tests",
    "/docs",  # the shipped docs tests read the pages, nav and theme partials
    "/zensical.toml",
    "/overrides",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "/tests/sandbox/.env*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/even_simpler_salesforce/_sync", "big-bang.md", "tests/migrate/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "S"]
ignore = ["S101", "S311", "RUF022", "B904", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "PT011", "RUF"]
"examples/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnnecessaryTypeIgnoreComment = false
reportDeprecated = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "sandbox: real-org tests (opt-in; need ESF_SANDBOX_* env vars)",
]
filterwarnings = ["error::DeprecationWarning:even_simpler_salesforce"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["even_simpler_salesforce"]
omit = ["*/_sync/*", "*/contrib/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\.$"]
